<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="monospace" font-size="12">
  <style>
    .board  { fill: #1a5276; stroke: #2c3e50; stroke-width: 2; rx: 8; }
    .module { fill: #f8f9fa; stroke: #495057; stroke-width: 1.5; rx: 6; }
    .held   { fill: #e9ecef; stroke: #adb5bd; stroke-width: 1; rx: 6; stroke-dasharray: 5,3; }
    .wire   { stroke-width: 1.8; fill: none; }
    .i2c    { stroke: #2980b9; }
    .pwr3v  { stroke: #e74c3c; }
    .gnd    { stroke: #2c3e50; }
    .sig    { stroke: #27ae60; }
    .led-r  { stroke: #e74c3c; }
    .led-g  { stroke: #27ae60; }
    text    { fill: #212529; }
    .title  { font-size: 16px; font-weight: bold; }
    .pin    { font-size: 10px; fill: #6c757d; }
    .note   { font-size: 10px; fill: #868e96; font-style: italic; }
    .held-t { fill: #adb5bd; }
  </style>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" class="title">PneumoScreen Wiring Diagram (Rev 2026-10-30)</text>

  <!-- Arduino Nano 33 BLE Sense Rev2 + TinyML Shield -->
  <rect x="260" y="60" width="280" height="180" class="board"/>
  <text x="400" y="85" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Arduino Nano 33 BLE Sense Rev2</text>
  <text x="400" y="102" text-anchor="middle" fill="#aed6f1" font-size="11">+ TinyML Shield (OV7670 camera)</text>

  <!-- Pin labels on the board -->
  <text x="268" y="130" fill="#d5f5e3" font-size="10">3.3V</text>
  <text x="268" y="145" fill="#fadbd8" font-size="10">GND</text>
  <text x="268" y="160" fill="#d5f5e3" font-size="10">A4 (SDA)</text>
  <text x="268" y="175" fill="#d5f5e3" font-size="10">A5 (SCL)</text>
  <text x="268" y="195" fill="#d5f5e3" font-size="10">D11</text>
  <text x="268" y="210" fill="#d5f5e3" font-size="10">D12</text>
  <text x="268" y="225" fill="#d5f5e3" font-size="10">D13 (Shield btn)</text>

  <!-- Camera note -->
  <text x="400" y="125" text-anchor="middle" fill="#85c1e9" font-size="9">OV7670 via Shield: D0-D10, A0, A1</text>
  <text x="400" y="138" text-anchor="middle" fill="#85c1e9" font-size="9">VSYNC=8  HREF=A1  PCLK=A0  XCLK=9</text>

  <text x="400" y="160" text-anchor="middle" fill="#f9e79f" font-size="9">Built-in: PDM mic, BMI270 IMU, HS3003</text>

  <!-- MAX30102 Pulse Oximeter -->
  <rect x="40" y="100" width="160" height="80" class="module"/>
  <text x="120" y="125" text-anchor="middle" font-weight="bold">MAX30102</text>
  <text x="120" y="140" text-anchor="middle" font-size="10">Pulse Oximeter</text>
  <text x="120" y="158" text-anchor="middle" class="pin">I2C addr: 0x57</text>
  <text x="120" y="170" text-anchor="middle" class="pin">1.8V I2C pull-ups on module</text>

  <!-- MAX30102 wires -->
  <line x1="200" y1="115" x2="260" y2="130" class="wire pwr3v"/>
  <text x="225" y="112" class="pin">3.3V</text>
  <line x1="200" y1="130" x2="260" y2="145" class="wire gnd"/>
  <text x="225" y="142" class="pin">GND</text>
  <line x1="200" y1="145" x2="260" y2="160" class="wire i2c"/>
  <text x="218" y="155" class="pin">SDA</text>
  <line x1="200" y1="155" x2="260" y2="175" class="wire i2c"/>
  <text x="218" y="170" class="pin">SCL</text>

  <!-- SSD1306 OLED -->
  <rect x="600" y="100" width="160" height="70" class="module"/>
  <text x="680" y="125" text-anchor="middle" font-weight="bold">SSD1306 OLED</text>
  <text x="680" y="140" text-anchor="middle" font-size="10">128x64 0.96"</text>
  <text x="680" y="155" text-anchor="middle" class="pin">I2C addr: 0x3C</text>

  <!-- OLED wires (from right side of board) -->
  <line x1="540" y1="130" x2="600" y2="115" class="wire pwr3v"/>
  <line x1="540" y1="145" x2="600" y2="130" class="wire gnd"/>
  <line x1="540" y1="160" x2="600" y2="140" class="wire i2c"/>
  <line x1="540" y1="175" x2="600" y2="150" class="wire i2c"/>

  <!-- Red LED on D11 -->
  <rect x="40" y="280" width="160" height="60" class="module"/>
  <circle cx="70" cy="310" r="10" fill="#e74c3c" stroke="#c0392b" stroke-width="1.5"/>
  <text x="130" y="305" text-anchor="middle" font-weight="bold">Red LED</text>
  <text x="130" y="320" text-anchor="middle" class="pin">D11 -> 220 ohm -> LED -> GND</text>
  <text x="130" y="332" text-anchor="middle" class="pin">Crackles / Wheezes</text>

  <line x1="200" y1="295" x2="260" y2="195" class="wire led-r"/>
  <text x="225" y="240" class="pin">D11</text>

  <!-- Green LED on D12 -->
  <rect x="40" y="360" width="160" height="60" class="module"/>
  <circle cx="70" cy="390" r="10" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="130" y="385" text-anchor="middle" font-weight="bold">Green LED</text>
  <text x="130" y="400" text-anchor="middle" class="pin">D12 -> 220 ohm -> LED -> GND</text>
  <text x="130" y="412" text-anchor="middle" class="pin">Normal</text>

  <line x1="200" y1="375" x2="260" y2="210" class="wire led-g"/>
  <text x="225" y="295" class="pin">D12</text>

  <!-- Shield Button (D13) -->
  <rect x="600" y="200" width="160" height="60" class="module"/>
  <text x="680" y="225" text-anchor="middle" font-weight="bold">Shield Button</text>
  <text x="680" y="240" text-anchor="middle" class="pin">D13 INPUT_PULLUP</text>
  <text x="680" y="252" text-anchor="middle" class="pin">LOW when pressed</text>

  <line x1="540" y1="225" x2="540" y2="225" class="wire sig"/>
  <line x1="530" y1="225" x2="600" y2="225" class="wire sig"/>
  <text x="560" y="220" class="pin">D13</text>

  <!-- MLX90614 (on hold) -->
  <rect x="600" y="310" width="160" height="70" class="held"/>
  <text x="680" y="335" text-anchor="middle" font-weight="bold" class="held-t">MLX90614</text>
  <text x="680" y="350" text-anchor="middle" class="held-t" font-size="10">Body Temperature</text>
  <text x="680" y="365" text-anchor="middle" class="held-t" font-size="10">I2C 0x5A — ON HOLD</text>

  <!-- I2C Bus label -->
  <rect x="300" y="270" width="200" height="30" rx="4" fill="#d4efdf" stroke="#27ae60"/>
  <text x="400" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e8449">I2C Bus (A4/A5, 3.3V)</text>

  <!-- Legend -->
  <rect x="40" y="470" width="720" height="130" rx="6" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="60" y="495" font-weight="bold" font-size="13">Legend</text>

  <line x1="60" y1="515" x2="100" y2="515" class="wire i2c"/>
  <text x="110" y="519" font-size="11">I2C (SDA/SCL)</text>

  <line x1="60" y1="535" x2="100" y2="535" class="wire pwr3v"/>
  <text x="110" y="539" font-size="11">3.3V Power</text>

  <line x1="60" y1="555" x2="100" y2="555" class="wire gnd"/>
  <text x="110" y="559" font-size="11">Ground</text>

  <line x1="60" y1="575" x2="100" y2="575" class="wire led-r"/>
  <text x="110" y="579" font-size="11">Red LED signal (D11)</text>

  <line x1="300" y1="515" x2="340" y2="515" class="wire led-g"/>
  <text x="350" y="519" font-size="11">Green LED signal (D12)</text>

  <line x1="300" y1="535" x2="340" y2="535" class="wire sig"/>
  <text x="350" y="539" font-size="11">Digital signal</text>

  <rect x="300" y="550" width="30" height="14" class="held" style="rx:2"/>
  <text x="340" y="562" font-size="11" class="held-t">On hold (not wired)</text>

  <!-- BOM note -->
  <text x="60" y="590" class="note">BOM: Nano 33 BLE Sense Rev2, TinyML Shield, OV7670, MAX30102, SSD1306 128x64, 2x 220ohm, red LED, green LED</text>

  <!-- Camera pin reservation note -->
  <text x="400" y="440" text-anchor="middle" class="note">Note: Pins D0-D10, A0, A1 are reserved for the OV7670 camera via the TinyML Shield.</text>
  <text x="400" y="455" text-anchor="middle" class="note">Do not use them for other peripherals when the shield is attached.</text>
</svg>
